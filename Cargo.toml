[workspace]
resolver = "2"
members = ["crates/jvm-core", "crates/jvm-cli", "crates/jvm-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["JVM Desktop contributors"]

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "gzip"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tempfile = "3"
winreg = "0.55"
junction = "1.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
# 只保留行号表，不生成完整调试符号：Windows/MSVC 下完整 pdb 单文件可达百 MB 级，
# 是 target 膨胀的主因。需要 IDE 断点查看变量时临时改成 debug = true。
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
