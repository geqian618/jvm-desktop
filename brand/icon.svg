<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3781F4"/>
      <stop offset="1" stop-color="#1750CE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>

  <!-- 字形整体放大 1.1 并按含把手的外接框居中 -->
  <g transform="translate(-59 -20.6) scale(1.1)">
    <!-- handle: drawn behind the cup body -->
    <circle cx="356" cy="297" r="45" fill="none" stroke="#FFFFFF" stroke-width="21"/>

    <!-- cup body: rounded trapezoid -->
    <path fill="#FFFFFF" d="
      M 183 213
      L 329 213
      Q 351 213 347.6 235
      L 328.7 357
      Q 325 381 303 381
      L 209 381
      Q 187 381 183.3 357
      L 164.4 235
      Q 161 213 183 213
      Z"/>

    <!-- steam -->
    <g fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round">
      <path d="M 203 189 C 189 170 217 156 203 141"/>
      <path d="M 256 183 C 242 162 270 148 256 129"/>
      <path d="M 309 189 C 295 170 323 156 309 141"/>
    </g>
  </g>

  <!-- layer gaps: end exactly at the slanted cup edge so the handle stays intact -->
  <rect x="84" y="264.3" width="235.4" height="14.3" fill="url(#bg)"/>
  <rect x="84" y="332.5" width="223.3" height="14.3" fill="url(#bg)"/>
</svg>
