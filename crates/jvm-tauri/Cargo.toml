[package]
name = "jvm-tauri"
description = "JVM Desktop 桌面应用（Tauri 2 壳，业务全部复用 jvm-core）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "jvm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "JVMDesktop"
path = "src/main.rs"

[features]
# 裸 cargo build --release 必须启用：未启用时 tauri 视为 dev 构建，不内嵌 dist 资产，
# exe 运行时改连 devUrl(localhost:5173)，无 vite dev server 时窗口报"localhost 拒绝连接"。
# tauri dev 会自动 --no-default-features 并剥离本 feature，开发流不受影响。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
jvm-core = { path = "../jvm-core" }
tauri-plugin-opener = "2.7.0"
tracing.workspace = true
